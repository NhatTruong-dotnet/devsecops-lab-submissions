---
metadata:
  id: "CKV2_CUSTOM_6"
  name: "Ensure S3 bucket versioning is enabled"
  category: "DATA_PROTECTION"
  severity: "MEDIUM"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_s3_bucket"

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket"
      attribute: "versioning.enabled"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_7"
  name: "Ensure S3 public access blocking is enabled"
  category: "NETWORKING"
  severity: "CRITICAL"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_s3_bucket_public_access_block"

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "block_public_acls"
      operator: "equals"
      value: true

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "block_public_policy"
      operator: "equals"
      value: true

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "ignore_public_acls"
      operator: "equals"
      value: true

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "restrict_public_buckets"
      operator: "equals"
      value: true
