---
metadata:
  id: "CKV2_CUSTOM_1"
  name: "Ensure RDS instances enable IAM database authentication"
  category: "IAM"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "iam_database_authentication_enabled"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_2"
  name: "Ensure RDS instances have storage encryption enabled"
  category: "ENCRYPTION"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "storage_encrypted"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_3"
  name: "Ensure RDS instances are not publicly accessible"
  category: "NETWORKING"
  severity: "CRITICAL"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "publicly_accessible"
      operator: "equals"
      value: false

---
metadata:
  id: "CKV2_CUSTOM_4"
  name: "Ensure RDS instances have automated backups configured"
  category: "BACKUP"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "backup_retention_period"
      operator: "greater_than"
      value: 0

---
metadata:
  id: "CKV2_CUSTOM_5"
  name: "Ensure RDS deletion protection is enabled"
  category: "DATA_PROTECTION"
  severity: "MEDIUM"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "deletion_protection"
      operator: "equals"
      value: true
