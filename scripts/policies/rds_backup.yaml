metadata:
  id: "CKV2_CUSTOM_4"
  name: "Ensure RDS instances have automated backups configured"
  category: "BACKUP"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "backup_retention_period"
      operator: "greater_than"
      value: 0
