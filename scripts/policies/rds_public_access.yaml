metadata:
  id: "CKV2_CUSTOM_3"
  name: "Ensure RDS instances are not publicly accessible"
  category: "NETWORKING"
  severity: "CRITICAL"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "publicly_accessible"
      operator: "equals"
      value: false
