---
metadata:
  id: "CKV2_CUSTOM_1"
  name: "Ensure RDS instances enable IAM database authentication"
  category: "IAM"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "iam_database_authentication_enabled"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_2"
  name: "Ensure RDS instances have storage encryption enabled"
  category: "ENCRYPTION"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "storage_encrypted"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_3"
  name: "Ensure RDS instances are not publicly accessible"
  category: "NETWORKING"
  severity: "CRITICAL"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "publicly_accessible"
      operator: "equals"
      value: false

---
metadata:
  id: "CKV2_CUSTOM_4"
  name: "Ensure RDS instances have automated backups configured"
  category: "BACKUP"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "backup_retention_period"
      operator: "greater_than"
      value: 0

---
metadata:
  id: "CKV2_CUSTOM_5"
  name: "Ensure RDS deletion protection is enabled"
  category: "DATA_PROTECTION"
  severity: "MEDIUM"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "deletion_protection"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_6"
  name: "Ensure S3 bucket versioning is enabled"
  category: "DATA_PROTECTION"
  severity: "MEDIUM"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_s3_bucket"

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket"
      attribute: "versioning.enabled"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_7"
  name: "Ensure S3 public access blocking is enabled"
  category: "NETWORKING"
  severity: "CRITICAL"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_s3_bucket_public_access_block"

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "block_public_acls"
      operator: "equals"
      value: true

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "block_public_policy"
      operator: "equals"
      value: true

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "ignore_public_acls"
      operator: "equals"
      value: true

    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket_public_access_block"
      attribute: "restrict_public_buckets"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_8"
  name: "Ensure EC2 root volumes are encrypted"
  category: "ENCRYPTION"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_instance"
      attribute: "root_block_device.0.encrypted"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_9"
  name: "Ensure CloudTrail log file validation is enabled"
  category: "LOGGING"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_cloudtrail"

    - cond_type: "attribute"
      resource_types:
        - "aws_cloudtrail"
      attribute: "enable_log_file_validation"
      operator: "equals"
      value: true

---
metadata:
  id: "CKV2_CUSTOM_10"
  name: "Ensure CloudTrail uses KMS encryption"
  category: "ENCRYPTION"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_cloudtrail"

    - cond_type: "attribute"
      resource_types:
        - "aws_cloudtrail"
      attribute: "kms_key_id"
      operator: "exists"
