metadata:
  id: "CKV2_CUSTOM_2"
  name: "Ensure RDS instances have storage encryption enabled"
  category: "ENCRYPTION"
  severity: "HIGH"

definition:
  and:
    - cond_type: "filter"
      attribute: "resource_type"
      operator: "within"
      value:
        - "aws_db_instance"

    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "storage_encrypted"
      operator: "equals"
      value: true
